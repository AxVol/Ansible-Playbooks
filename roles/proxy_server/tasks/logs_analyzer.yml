- name: remove deafult apache conf
  ansible.builtin.command:
    cmd: a2dissite 000-default
    removes: /etc/apache2/sites-available/000-default.conf

- name: upload apache config
  ansible.builtin.copy:
    src: squidarm.conf
    dest: "{{ apache_dir }}"
    owner: root
    group: root
    mode: 0644
  notify: restart apache

- name: download repos
  ansible.builtin.get_url:
    url: "https://squidarm.ru/squidarm.asc"
    dest: "/etc/apt/keyrings/squidarm.asc"
    mode: 0644

- name: install conf repos
  ansible.builtin.copy:
    src: squidarm.list
    dest: /etc/apt/sources.list.d/squidarm.list
    owner: root
    group: root
    mode: 0644

- name: install squidarm
  ansible.builtin.apt:
    name: squidarm
    update_cache: true

- name: install configs
  ansible.builtin.copy:
    src: sarm.conf
    dest: /etc/squidarm/sarm.conf
    owner: root
    group: root
    mode: 0755

- name: start web_apache
  ansible.builtin.command:
    cmd: a2ensite squidarm
    creates: "{{ apache_dir }}"
  notify: restart apache

- name: start service
  ansible.builtin.service:
    name: "{{ item }}"
    state: restarted
    enabled: true
  loop:
    - squidarm
    - squidarm_web
