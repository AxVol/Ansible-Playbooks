---
- name: Astra Repos delivery
  ansible.builtin.template:
    src: templates/sources.list.j2
    dest: /etc/apt/sources.list
    owner: root
    group: root
    mode: '0644'

- name: Installing utilities for server
  ansible.builtin.apt:
    update_cache: true

- name: Installing utilities for server
  ansible.builtin.apt:
    name: "{{ tools }}"
    state: present